<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>許又仁政見森林</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:ital,wght@0,500;1,500&display=swap">
<style>
/* Layout: forest canvas fills the screen; policy index docked LEFT; policy/item card floats RIGHT under the brand; all controls in one bottom bar; phones get bottom sheets */
:root{
  --bg:#ece4f4; --water:#9cc9cc; --panel:#fbf8fe; --panel-2:#f1e9f8; --chip:#e7dcf2;
  --ink:#24163a; --muted:#6a5a80; --line:#ddd0ea;
  --moss:#5b2a8c; --moss-ink:#ffffff; --sun:#c8143a; --dark-pill:#55267f; --dark-pill-ink:#fff4b8;
  --leaf:#4f9a3a; --trunk:#7a5534;
  --brand-1:#7a3fb4; --brand-2:#4a2173; --brand-ink:#fff4b8; --brand-name:#ffffff; --brand-sub:#e3d3f5;
  --shadow:0 10px 30px rgba(60,30,90,.16),0 2px 6px rgba(60,30,90,.08);
  --f-display:"LXGW WenKai TC","Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --p1:#c47a1c; --p2:#c4553a; --p3:#3f8a3a; --p4:#24808d; --p5:#7a5cba; --p6:#b8487a;
  --index-w:340px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1226; --water:#12252b; --panel:#21182f; --panel-2:#2b203b; --chip:#33274a;
  --ink:#efe8f7; --muted:#b4a4c9; --line:#3a2d4d;
  --moss:#c9a6ef; --moss-ink:#1a1226; --sun:#ff7088; --dark-pill:#c9a6ef; --dark-pill-ink:#1a1226;
  --leaf:#8cc47c; --trunk:#b8865a;
  --shadow:0 10px 30px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
  --p1:#e09a3e; --p2:#e2775c; --p3:#6dba5f; --p4:#4cb0bd; --p5:#a68ae0; --p6:#df73a3;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1a1226; --water:#12252b; --panel:#21182f; --panel-2:#2b203b; --chip:#33274a;
  --ink:#efe8f7; --muted:#b4a4c9; --line:#3a2d4d;
  --moss:#c9a6ef; --moss-ink:#1a1226; --sun:#ff7088; --dark-pill:#c9a6ef; --dark-pill-ink:#1a1226;
  --leaf:#8cc47c; --trunk:#b8865a;
  --shadow:0 10px 30px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
  --p1:#e09a3e; --p2:#e2775c; --p3:#6dba5f; --p4:#4cb0bd; --p5:#a68ae0; --p6:#df73a3;
  color-scheme:dark;
}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--water)}
#scene.drag{cursor:grabbing}#scene.hot{cursor:pointer}
.float{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}

/* brand (top right) */
.brand{position:absolute;top:14px;right:max(16px,env(safe-area-inset-right,0px));z-index:5;border-radius:18px;padding:12px 18px;display:grid;grid-template-columns:auto auto;gap:4px 16px;align-items:center;
  background:linear-gradient(135deg,var(--brand-1),var(--brand-2));border:0;box-shadow:var(--shadow);max-width:calc(100% - var(--index-w) - 32px)}
.brand .big{grid-row:span 2;font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.18;color:var(--brand-ink);letter-spacing:.06em;white-space:nowrap}
.brand .name{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:.1em;line-height:1;color:var(--brand-name);white-space:nowrap}
.brand .name small{font-size:13px;font-weight:400;letter-spacing:.04em;margin-left:4px;color:var(--brand-sub)}
.brand .sub{font-size:12px;color:var(--brand-sub);white-space:nowrap}
.brand .sub b{color:var(--brand-ink);font-weight:700;letter-spacing:.08em}

/* bottom bar */
.bottombar{position:absolute;left:var(--index-w);right:0;bottom:16px;z-index:5;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;pointer-events:none;
  padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.bottombar>*,.bb-row>*{pointer-events:auto}
.bb-row{display:contents}
.time{order:1}.tools{order:2}.vseg{order:3}
.seg{display:flex;align-items:center;gap:2px;border-radius:999px;padding:5px 8px}
.ico{border:0;background:transparent;border-radius:999px;display:grid;justify-items:center;gap:1px;padding:5px 9px;min-width:44px;color:var(--muted);font-size:11px;line-height:1.2}
.ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ico:hover{color:var(--ink);background:var(--panel-2)}
.ico[aria-pressed="true"]{background:var(--dark-pill);color:var(--dark-pill-ink)}
.time .ico{min-width:38px;padding:7px 9px}
.time .ico span{display:none}
.ico .q{font-family:var(--f-mono);font-size:16px;line-height:18px;font-weight:500}

/* icons */
.tree{width:24px;height:24px;flex:none;display:block}
.leaf{width:16px;height:16px;flex:none;display:block}

/* index (left dock) */
.index{position:absolute;top:0;left:0;bottom:0;width:var(--index-w);z-index:6;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px)}
.ix-head .eyebrow{font-family:var(--f-body);font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:none}
.ix-head{padding:22px 22px 12px;display:grid;gap:8px;position:relative}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;color:var(--sun);text-transform:uppercase}
.ix-head h2{margin:0;font-family:var(--f-display);font-size:27px;line-height:1.25;letter-spacing:.04em;color:var(--moss);white-space:nowrap}
.ix-head .eyebrow.who{display:flex;align-items:center;gap:12px;font-size:30px;line-height:1.1;letter-spacing:.08em;white-space:nowrap}
@media (max-width:860px){.ix-head .eyebrow.who{padding-right:40px}}
.ix-head .eyebrow small{font-size:24px;font-weight:400;letter-spacing:.02em;margin-left:4px}
.avatar{width:60px;height:60px;border-radius:50%;object-fit:cover;flex:none;border:3px solid var(--moss);box-shadow:var(--shadow);background:var(--brand-1)}
.ix-head p{margin:0;font-size:12px;color:var(--muted);line-height:1.6}
.search{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:11px 14px;font-size:14px}
.search::placeholder{color:var(--muted)}
.ix-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ix-tabs button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:11px 8px;font-size:13px}
.ix-tabs button[aria-selected="true"]{background:var(--dark-pill);color:var(--dark-pill-ink);border-color:transparent}
.ix-body{flex:1;min-height:0;overflow:auto;padding:4px 14px 24px;border-top:1px solid var(--line)}
.ix-close{display:none;position:absolute;top:14px;right:14px;width:34px;height:34px;border:0;border-radius:50%;background:var(--panel-2);font-size:16px;color:var(--muted)}
.prow{display:grid;grid-template-columns:44px 30px 1fr auto;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:14px 8px;border-radius:12px;border-left:3px solid transparent}
.prow:hover{background:var(--panel-2)}
.prow .no{font-family:var(--f-mono);font-style:italic;font-size:26px;color:var(--c);line-height:1}
.prow .tt{font-size:15px;font-weight:700;line-height:1.4;min-width:0}
.prow .ct{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.prow[aria-expanded="true"]{background:color-mix(in srgb,var(--c) 10%,transparent);border-left-color:var(--c)}
.sublist{display:grid;gap:2px;padding:4px 8px 12px 44px}
.explore{justify-self:start;border:0;background:transparent;color:var(--c);font-weight:700;font-size:13px;padding:6px 0}
.subbtn{display:grid;grid-template-columns:24px 20px 1fr;align-items:center;gap:6px;border:0;background:transparent;text-align:left;padding:8px 6px;border-radius:8px;font-size:13px;line-height:1.5}
.subbtn:hover{background:var(--panel-2)}
.circ{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--c);color:var(--c);font-family:var(--f-mono);font-size:10px;font-weight:500}
.prt{display:grid;gap:6px;padding:12px 8px;border-bottom:1px dashed var(--line)}
.prt b{font-family:var(--f-mono);font-size:13px;color:var(--sun)}
.prt .lk{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}
.blank{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:13px;background:var(--panel-2)}
.hit{padding:10px 8px;border-bottom:1px solid var(--line);display:grid;gap:3px;width:100%;text-align:left;border-left:0;border-right:0;border-top:0;background:transparent}
.hit small{color:var(--c);font-size:11px;font-weight:700}
.hit span{font-size:14px}
.empty{color:var(--muted);font-size:13px;padding:16px 8px}

/* left card */
.card{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:auto;bottom:92px;max-height:calc(100% - 204px);width:360px;z-index:6;border-radius:20px;display:flex;flex-direction:column;overflow:hidden}
.c-head{padding:20px 20px 14px;display:grid;gap:12px;position:relative}
.c-top{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;padding-right:30px}
.tile{width:56px;height:56px;border-radius:14px;background:color-mix(in srgb,var(--c) 16%,var(--panel));display:grid;place-items:center;color:var(--c)}
.tile svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.c-top .eb{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--c)}
.c-top h2{margin:2px 0 0;font-family:var(--f-display);font-size:24px;line-height:1.3;letter-spacing:.03em;text-wrap:balance}
.x{position:absolute;top:14px;right:14px;width:32px;height:32px;border:0;border-radius:50%;background:transparent;font-size:18px;color:var(--muted)}
.x:hover{background:var(--panel-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted)}
.chip b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.chip.c{border-color:color-mix(in srgb,var(--c) 40%,var(--line));color:var(--c)}
.c-body{overflow:auto;flex:1;min-height:0;padding:0 20px 20px;display:grid;gap:16px;align-content:start}
.c-body h3{margin:6px 0 8px;font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.irow{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;margin-bottom:8px}
.irow:hover{border-color:var(--c)}
.irow .ar{color:var(--muted)}
.desc{font-size:15px;line-height:1.85;margin:0;padding:12px 14px;background:color-mix(in srgb,var(--c) 7%,var(--panel));border-radius:12px}
.back{justify-self:start;border:0;background:transparent;color:var(--muted);font-size:13px;padding:4px 0}
.back:hover{color:var(--ink)}
.c-foot{display:flex;justify-content:space-between;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.c-foot button{border:0;background:transparent;font-size:12px;color:var(--muted);padding:8px;border-radius:8px;text-align:left}
.c-foot button:hover{background:var(--panel-2);color:var(--ink)}
.live{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.live b{font-family:var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}

/* log */
.tabs{display:flex;gap:4px;padding:0 20px}
.tabs button{border:0;background:transparent;border-bottom:2px solid transparent;padding:8px 10px;font-size:13px;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--moss)}
.livetag{font-family:var(--f-mono);font-size:10px;color:#fff;background:var(--p2);border-radius:4px;padding:1px 5px;margin-left:6px}
.loglist{list-style:none;margin:0;padding:0}
.loglist li{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.6}
.loglist time{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.loglist em{font-style:normal;color:var(--c);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:2px;min-width:0}
.stat small{font-size:11px;color:var(--muted)}
.stat b{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.stat .s{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{display:grid;grid-template-columns:64px 1fr 30px;gap:8px;align-items:center;font-size:12px;margin-bottom:6px}
.bar .tr{height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.bar .fl{height:100%;background:var(--c);border-radius:4px;transition:width .4s}
.bar span:last-child{font-family:var(--f-mono);text-align:right}

.status{position:absolute;left:calc(var(--index-w) + 16px);top:16px;z-index:4;border-radius:999px;padding:7px 14px;font-size:12px;color:var(--muted);white-space:nowrap;max-width:calc(100% - var(--index-w) - 460px);overflow:hidden;text-overflow:ellipsis}
.status b{font-family:var(--f-mono);color:var(--ink);font-weight:500}

/* list view */
.listview{position:absolute;inset:0;left:var(--index-w);z-index:7;background:var(--bg);overflow:auto;padding-top:40px;padding-bottom:130px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.lv{max-width:980px;margin:0 auto;display:grid;gap:16px}
.lv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:14px}
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:10px;align-content:start;min-width:0}
.lcard .no{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-style:italic;font-size:28px;color:var(--c)}
.lcard h3{margin:0;font-family:var(--f-display);font-size:22px;line-height:1.35}
.lcard ol{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.lcard li{display:grid;grid-template-columns:24px 20px 1fr;gap:8px;font-size:14px;line-height:1.75}
.lcard li b{display:block}
.lcard .go{justify-self:start;border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:7px 14px;font-size:13px}

/* tour */
.tour{position:absolute;left:50%;transform:translateX(calc(-50% + var(--index-w)/2));bottom:130px;z-index:10;width:min(440px,calc(100% - 32px));border-radius:18px;padding:18px 20px;display:grid;gap:10px}
.tour .st{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tour h3{margin:0;font-family:var(--f-display);font-size:22px}
.tour p{margin:0;line-height:1.7;font-size:14px}
.tour .row{display:flex;justify-content:space-between;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:8px 16px;font-size:14px}
.btn.primary{background:var(--moss);color:var(--moss-ink);border-color:transparent}
.loader{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);z-index:20;font-family:var(--f-display);font-size:20px;color:var(--muted);transition:opacity .6s}
.loader.out{opacity:0;pointer-events:none}
.mobile-only{display:none}

@media (max-width:1180px){ .status{display:none} }
@media (max-width:860px){
  :root{--index-w:0px}
  .brand{top:10px;right:max(10px,env(safe-area-inset-right,0px));padding:8px 12px;gap:2px 10px;max-width:calc(100% - 20px)}
  .brand .big{font-size:16px}.brand .name{font-size:18px}.brand .name small{font-size:11px}.brand .sub{display:none}
  .bottombar{bottom:10px;flex-direction:column;gap:6px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
  .bb-row{display:flex;gap:6px;order:1;max-width:100%}
  .tools{order:2}
  .seg{max-width:100%;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
  .mobile-only{display:grid}
  .index{top:auto;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:128px;width:auto;height:55%;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding-left:0}
  .index:not(.open){display:none}
  .ix-close{display:block}
  .card{left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));width:auto;top:auto;bottom:128px;max-height:55%}
  .listview{left:0;padding-top:72px}
  .tour{transform:translateX(-50%);bottom:136px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* --- v6 --- */
.slogans{display:grid;gap:2px}
.ix-head .slogans h2{font-size:27px}
.brand .big.who{display:flex;align-items:center;gap:10px;font-size:30px;color:var(--brand-name);letter-spacing:.08em}
.brand .big.who small{font-size:12px;font-weight:400;color:var(--brand-sub);letter-spacing:.02em;margin-left:4px}
.brand .avatar{width:52px;height:52px;border-color:var(--brand-ink)}
.prow{grid-template-columns:auto auto 1fr auto}
.prow .no{padding-right:3px}
.prow .tt{padding-left:10px}
.subbtn .leaf{margin-left:-4px}
.irow .leaf{margin-left:-7px}
.lcard li .leaf{margin-left:-6px}
.lcard .no{gap:3px}
.tooltoggle{display:none}
.tooltoggle svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
@media (max-width:860px){
  .brand{max-width:calc(100% - 120px)}
  .brand .big.who{font-size:20px;gap:8px}
  .brand .avatar{width:38px;height:38px;border-width:2px}
  .brand{grid-template-columns:auto;gap:4px}
  .brand .big.who{grid-row:auto}
  .brand .name{font-size:14px;letter-spacing:.12em}
  .tooltoggle{display:flex;align-items:center;gap:6px;position:absolute;z-index:6;top:14px;left:max(10px,env(safe-area-inset-left,0px));border-radius:999px;padding:9px 14px;font-size:13px;color:var(--ink)}
  .tooltoggle[aria-expanded="true"]{background:var(--dark-pill);color:var(--dark-pill-ink);border-color:transparent}
  #app:not(.tools-open) .bottombar{display:none}
  .card,.index{bottom:max(10px,env(safe-area-inset-bottom,0px))}
  .tools-open .card,.tools-open .index{bottom:128px}
  .tour{bottom:24px}.tools-open .tour{bottom:136px}
}
</style>

<div id="app">

const SHIRTS=["#d9653b","#3c7dbb","#e2b33a","#6b9e4a","#9b5fb5","#d24f6e","#2d9a8f","#e88c3a"],HATS=["#f2dfa8","#e9c46a","#c9d6a3","#f4f1e6","#d8b48a"];
const NODES=[{gx:C,gy:C}].concat(POL.map(p=>({gx:p.gx,gy:p.gy})));
const nbrs=n=>n===0?[1,2,3,4,5,6]:[0,((n-1+1)%6)+1,((n-1+5)%6)+1];
const visitors=[];for(let m=0;m<16;m++){const n=Math.floor(R()*7),nd=NODES[n];visitors.push({id:m+1,gx:nd.gx+(R()-.5)*.8,gy:nd.gy+(R()-.5)*.8,node:n,route:[],mode:"idle",wait:R()*2,shirt:SHIRTS[m%8],pack:["#5b4a3a","#3f5a3a","#7a3a2a"][m%3],hat:HATS[m%5],sp:.9+R()*.5,ph:R()*6,basket:0,spot:null,moving:false});}

function planNext(v){const here=v.node;

  v.justGathered=false;const o=nbrs(here),n=o[Math.floor(R()*o.length)];v.target=n;v.route=[{gx:NODES[n].gx+(R()-.5)*.6,gy:NODES[n].gy+(R()-.5)*.6}];v.mode="walk";}
function arrive(v){if(v.mode==="walk"){v.node=v.target;if(v.node>0){POL[v.node-1].visits++;if(R()<.25)log(`遊客 ${pad(v.id)} 走進`,v.node-1,"空地");}v.mode="idle";v.wait=.4+R()*(v.node===0?2.4:1.2);}
  else if(v.mode==="toItem"){v.mode="gathering";v.wait=1.3;}else if(v.mode==="back"){v.mode="idle";v.wait=.3;v.justGathered=true;}}
function finishGather(v,now){const s=v.spot;if(s&&s.alive){s.alive=false;s.anim=now;s.back=now+9+R()*8;s.res=false;v.basket++;totalGathered++;typeCount[s.type]++;POL[s.k].gathered++;const it=ITEMS[s.type];log(`遊客 ${pad(v.id)} 在`,s.k,`採集了${it.mw}${it.name}`);}
  v.spot=null;const nd=NODES[v.node];v.route=[{gx:nd.gx+(R()-.5)*.5,gy:nd.gy+(R()-.5)*.5}];v.mode="back";}
function stepVisitors(dt,now){visitors.forEach(v=>{v.moving=false;
    if(v.mode==="idle"||v.mode==="gathering"){v.wait-=dt;if(v.wait<=0){if(v.mode==="gathering")finishGather(v,now);else planNext(v);}return;}
    const tg=v.route[0];if(!tg){v.mode="idle";return;}const dx=tg.gx-v.gx,dy=tg.gy-v.gy,d=Math.hypot(dx,dy),st=v.sp*dt*(v.mode==="walk"?1.15:.8);

  spots.forEach(s=>{if(!s.alive&&now>s.back){s.alive=true;s.anim=-1;}});}

  rr(c,x+(f>0?-6.5:2),y-14+cr-bob,4.5,7,1.5,v.pack);rr(c,x-3.5,y-14+cr-bob,7,8.5,2.5,v.shirt);circ(c,x,y-17+cr-bob,3,P.skin);ell(c,x,y-19+cr-bob,5.2,1.6,v.hat);ell(c,x,y-20.4+cr-bob,3,2.1,v.hat);

let markHits=[],labelHits=[];
function render(t){const c=ctx;c.setTransform(dpr,0,0,dpr,0,0);
  const g=c.createLinearGradient(0,0,0,VH);g.addColorStop(0,P.water1);g.addColorStop(1,P.water2);c.fillStyle=g;c.fillRect(0,0,VW,VH);
  c.setTransform(dpr*cam.z,0,0,dpr*cam.z,dpr*cam.ox,dpr*cam.oy);
  c.strokeStyle=P.ripple;c.lineWidth=1;ripples.forEach(r=>{const[x,y]=g2w(r.gx,r.gy);const a=(Math.sin(t*.8+r.ph)+1)/2;c.globalAlpha=.3+a*.7;c.beginPath();c.moveTo(x-r.l/2+a*4,y);c.lineTo(x+r.l/2+a*4,y);c.stroke();});c.globalAlpha=1;

  [hover,selected].forEach((k,q)=>{if(k<0)return;const p=POL[k];const[x,y]=g2w(p.gx,p.gy);c.save();c.globalAlpha=q?.3:.2;ell(c,x,y,2.55*.7071*TW,2.55*.7071*TH,PC[k]);c.restore();if(q){c.save();c.strokeStyle=PC[k];c.lineWidth=2;c.beginPath();c.ellipse(x,y,2.55*.7071*TW,2.55*.7071*TH,0,0,6.283);c.stroke();c.restore();}});
  const objs=[];for(const tr of trees)objs.push([tr.wy,0,tr]);for(const o of isletDeco)objs.push([o.wy,6,o]);

  for(const v of visitors)objs.push([g2w(v.gx,v.gy)[1]+.2,4,v]);
  objs.sort((a,b)=>a[0]-b[0]);
  boats.forEach(b=>drawBoat(c,b,reduced?0:t));
  for(const o of objs){const ty=o[1];if(ty===0)drawTree(c,o[2],t);else if(ty===1)drawLandmark(c,o[2],t);else if(ty===2)drawCamp(c,t);else if(ty===3)drawItem(c,o[2],t);else if(ty===4)drawVisitor(c,o[2],t);else drawRock(c,o[2]);}
  if(linesOn)drawPartnerLines(c,t);
  if(P.dark){flies.forEach(f=>{const x=f.wx+Math.sin(t*f.sp+f.ph)*12,y=f.wy+Math.cos(t*f.sp*.7+f.ph)*8;const a=reduced?.5:(Math.sin(t*2.3+f.ph*3)+1)/2;glow(c,x,y,7,"rgba(220,255,140,A)",.55*a);circ(c,x,y,1,"rgba(240,255,190,"+(.4+.6*a)+")");});}
  c.setTransform(dpr,0,0,dpr,0,0);
  if(TINT[timeOfDay]){c.fillStyle=TINT[timeOfDay];c.fillRect(0,0,VW,VH);}
  // 細項標記
  markHits=[];
  if(selected>=0){const p=POL[selected];const ord=p.marks.map((m,i)=>i).sort((a,b)=>((a===selItem||(hoverMark&&hoverMark.i===a))?1:0)-((b===selItem||(hoverMark&&hoverMark.i===b))?1:0));ord.forEach(i=>{const m=p.marks[i];const[wx,wy]=g2w(m.gx,m.gy);const sx=wx*cam.z+cam.ox,sy=(wy-14)*cam.z+cam.oy;
    const on=i===selItem;c.font="500 12px 'Noto Sans TC',sans-serif";const txt=p.items[i][0];const tw=c.measureText(txt).width;const showT=on||(hoverMark&&hoverMark.i===i)||(p.items.length<=5&&cam.z>1.05);

    circ(c,sx,sy,9,on?TOK.panel:PC[selected]);c.fillStyle=on?PC[selected]:"#fff";c.font="700 10px 'IBM Plex Mono',monospace";c.textAlign="center";c.textBaseline="middle";c.fillText(i+1,sx,sy+.5);
    if(showT){c.fillStyle=on?"#fff":TOK.ink;c.font="500 12px 'Noto Sans TC',sans-serif";c.textAlign="left";c.fillText(txt,sx+14,sy+.5);}
    c.strokeStyle=PC[selected];c.lineWidth=1.2;c.beginPath();c.moveTo(sx,sy+h/2);c.lineTo(sx,sy+12*cam.z+4);c.stroke();
    markHits.push({i,x0,y0:sy-h/2,w,h});});}

    const sel=k===selected;const txt=p.short;c.font="700 12px 'Noto Sans TC',sans-serif";const tw=c.measureText(txt).width;const w=tw+44,h=26;
    c.save();c.shadowColor="rgba(0,0,0,.18)";c.shadowBlur=8;c.shadowOffsetY=2;rr(c,sx-w/2,sy-h/2,w,h,13,sel?TOK["dark-pill"]:TOK.panel);c.restore();
    c.fillStyle=PC[k];c.font="italic 500 11px 'IBM Plex Mono',monospace";c.textAlign="left";c.textBaseline="middle";c.fillText(pad(k+1),sx-w/2+12,sy+.5);
    c.fillStyle=sel?TOK["dark-pill-ink"]:TOK.ink;c.font="700 12px 'Noto Sans TC',sans-serif";c.fillText(txt,sx-w/2+32,sy+.5);
    labelHits.push({k,x0:sx-w/2,y0:sy-h/2,w,h});});
}

function resize(){dpr=Math.min(2,window.devicePixelRatio||1);const r=cv.getBoundingClientRect();VW=r.width;VH=r.height;cv.width=Math.round(VW*dpr);cv.height=Math.round(VH*dpr);}
const wide=()=>VW>860;
function insets(){const w=wide();const cardOn=!$("#card").hidden;return{L:w?356:16,Rt:w&&cardOn?392:16,T:w?(cardOn?40:110):70,Bm:w?96:((cardOn||$("#index").classList.contains("open")?VH*.55:0)+($("#app").classList.contains("tools-open")?140:24))};}
function fitTarget(){const I=insets();const aw=VW-I.L-I.Rt,ah=VH-I.T-I.Bm;const bw=B.x1-B.x0,bh=B.y1-B.y0;const z=Math.max(.3,Math.min(1.6,Math.min(aw/bw,ah/bh)));return{z,ox:I.L+aw/2-(B.x0+bw/2)*z,oy:I.T+ah/2-(B.y0+bh/2)*z};}
function flyTo(tg){if(reduced){cam.z=tg.z;cam.ox=tg.ox;cam.oy=tg.oy;fly=null;return;}fly={t0:performance.now(),z0:cam.z,x0:cam.ox,y0:cam.oy,z1:tg.z,x1:tg.ox,y1:tg.oy};}
function focusPlot(k){const p=POL[k];const[wx,wy]=g2w(p.gx,p.gy);const I=insets();const z=wide()?1.7:1.3;
  const cx=I.L+(VW-I.L-I.Rt)/2,cy=wide()?I.T+(VH-I.T-I.Bm)/2+10:Math.max(120,(VH-I.Bm)/2+30);flyTo({z,ox:cx-wx*z,oy:cy-(wy-20)*z});}
function hitBox(list,sx,sy){for(let n=list.length-1;n>=0;n--){const b=list[n];if(sx>=b.x0&&sx<=b.x0+b.w&&sy>=b.y0&&sy<=b.y0+b.h)return b;}return null;}

const ptrs=new Map();let drag=null,pinch=null;

  else if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:cam.z,ox:cam.ox,oy:cam.oy,mx:(a.x+b.x)/2,my:(a.y+b.y)/2};drag=null;}});

  if(pinch&&ptrs.size===2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const z=Math.max(.3,Math.min(2.6,pinch.z*d/pinch.d));const mx=pinch.mx-r.left,my=pinch.my-r.top;cam.z=z;cam.ox=mx-(mx-pinch.ox)*z/pinch.z;cam.oy=my-(my-pinch.oy)*z/pinch.z;return;}
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;if(drag.moved){cam.ox=drag.ox+dx;cam.oy=drag.oy+dy;cv.classList.add("drag");}return;}

  if(cardMode==="policy"&&selected>=0){const a=$("#lvHere");if(a){a.textContent=hereCount(selected);$("#lvGath").textContent=POL[selected].gathered;$("#lvVis").textContent=POL[selected].visits;}}},1000);

/* ---------- 工具 ---------- */
function setStatus(){const el=$("#status");if(hover>=0&&!hoverMark){const p=POL[hover];el.innerHTML=`<span style="color:${PC[hover]}">●</span> ${pad(hover+1)} ${esc(p.title)} — 點擊查看`;}
  else el.innerHTML=`•ᴗ• 森林 <b>${clock()}</b> · 點一塊空地，開始探索`;}
function syncTools(){$("#tLabels").setAttribute("aria-pressed",labelsOn);$("#tGather").setAttribute("aria-pressed",gatherOn);$("#tLines").setAttribute("aria-pressed",linesOn);$("#tPause").setAttribute("aria-pressed",paused);$("#pauseLbl").textContent=paused?"播放":"暫停";
  $("#tLog").setAttribute("aria-pressed",cardMode==="log");document.querySelectorAll("[data-time]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.time===timeOfDay));}
function setTime(t){timeOfDay=t;const np=t==="night"?DARK:LIGHT;if(np!==P){P=np;buildTerrain();}syncTools();}
document.querySelectorAll("[data-time]").forEach(b=>b.onclick=()=>setTime(b.dataset.time));
$("#tLabels").onclick=()=>{labelsOn=!labelsOn;syncTools();};
$("#tGather").onclick=()=>{gatherOn=!gatherOn;if(!gatherOn)visitors.forEach(v=>{if(v.spot){v.spot.res=false;v.spot=null;}if(v.mode==="toItem"||v.mode==="gathering"){const nd=NODES[v.node];v.route=[{gx:nd.gx,gy:nd.gy}];v.mode="back";}});syncTools();};
$("#tLines").onclick=()=>{linesOn=!linesOn;syncTools();};
$("#tPause").onclick=()=>{paused=!paused;syncTools();};
$("#tFit").onclick=()=>{selected=-1;selItem=-1;if(cardMode!=="log")closeCard();flyTo(fitTarget());};
$("#tLog").onclick=openLog;
$("#tToggle").onclick=()=>{const on=$("#app").classList.toggle("tools-open");$("#tToggle").setAttribute("aria-expanded",on);$("#tToggle .lbl").textContent=on?"收起":"工具";if(!wide()&&selected<0)flyTo(fitTarget());};

/* 檢視 */
function setView(v){$("#listView").hidden=v!=="list";$("#vList").setAttribute("aria-pressed",v==="list");}
$("#vFull").onclick=()=>{setView("scene");closeCard();flyTo(fitTarget());};
$("#vList").onclick=()=>setView($("#listView").hidden?"list":"scene");
function buildList(){$("#lvGrid").innerHTML=POL.map((p,k)=>`<article class="lcard" style="--c:${PC[k]}"><div class="no">${pad(k+1)}${TREE}</div><h3>${esc(p.title)}</h3>
  <ol>${p.items.map((it,i)=>`<li><span class="circ">${i+1}</span>${LEAF}<div><b>${esc(it[0])}</b>${esc(it[1])}</div></li>`).join("")}</ol><button class="go" data-k="${k}">在森林中查看 →</button></article>`).join("");
  $("#lvGrid").querySelectorAll(".go").forEach(b=>b.onclick=()=>{setView("scene");openPolicy(+b.dataset.k);});}

/* 導覽 */
const TOUR=[["這是一座政見森林","森林裡有六塊林間空地，每一塊代表一項政見：林道與木橋、林間市集、草原遊戲場、樹屋聚落、苗圃與田園、老樟樹下。"],
 ["選一項政見","點空地、標示，或左側索引裡的政見。畫面會飛進那塊空地，地上用 ①②③ 標出每個細項；再點細項，可以看它的「重點」和「和誰一起做」。"],
 ["遊客在林中採集","遊客從中央營地出發，沿著林道走訪各塊空地，撿拾蘑菇、松果、楓葉、竹筍等森林元素。關掉「採集」就只散步不採集。"],
 ["夥伴關係","政見之間互相支撐。打開「夥伴線」可以看到 10 條連線，索引的「夥伴關係」分頁列出每一項，內容之後補上。"],
 ["時段與日誌","下方工具列可以切換清晨、白天、黃昏、夜晚。「日誌」記錄林中正在發生的事。拖曳可移動畫面，滾輪或雙指可縮放，「鳥瞰」回到全景。"]];
let tourI=0;
function showTour(i){tourI=i;const t=TOUR[i];$("#tour").hidden=false;$("#tourStep").textContent=`${i+1} / ${TOUR.length}`;$("#tourTitle").textContent=t[0];$("#tourText").textContent=t[1];$("#tourNext").textContent=i===TOUR.length-1?"開始探索":"下一步 →";
  if(i===3&&!linesOn){linesOn=true;syncTools();}}
$("#tourNext").onclick=()=>{if(tourI<TOUR.length-1)showTour(tourI+1);else $("#tour").hidden=true;};
$("#tourSkip").onclick=()=>$("#tour").hidden=true;$("#vHelp").onclick=()=>{setView("scene");showTour(0);};
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(!$("#tour").hidden)$("#tour").hidden=true;else if(cardMode==="item")openPolicy(selected,true);else if(!$("#card").hidden)closeCard();else toggleIndex(false);});

/* 主題 */
function themeChange(){readTokens();setTime(isDarkUI()?"night":(timeOfDay==="night"?"day":timeOfDay));buildTerrain();renderIndex();buildList();if(selected>=0)$("#card").style.setProperty("--c",PC[selected]);}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",themeChange);
new MutationObserver(themeChange).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

function boot(){resize();buildTerrain();renderIndex();buildList();$("#ixCount").textContent=`6 項政見 ／ ${TOTAL} 個細項`;syncTools();setStatus();
  if(!wide())toggleIndex(true);
  const f=fitTarget();cam.z=f.z;cam.ox=f.ox;cam.oy=f.oy;for(let i=0;i<30;i++)stepVisitors(.1,0);
  requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame);});setTimeout(()=>$("#loader").classList.add("out"),350);}
let rt;window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{resize();buildTerrain();if(selected>=0)focusPlot(selected);else flyTo(fitTarget());},120);});
if(document.fonts&&document.fonts.ready)Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]).then(boot);else boot();
})();
</script>

</body></html>
